<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea Bracelet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..700;1,300..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; border-radius: 0 !important; }
  html, body { margin: 0; height: 100%; background: #000; color: #f2f2f0; font-family: "Inter Tight", "Pretendard", sans-serif; }
  body { display: flex; }
  #main { flex: 1; min-width: 0; position: relative; }
  #page { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .b { font: 500 11px "Inter Tight", sans-serif; text-transform: uppercase; letter-spacing: .02em; padding: 4px 12px; border: 1px solid #f2f2f0; background: transparent; color: #f2f2f0; cursor: pointer; }
  .b:hover:not(:disabled) { background: #f2f2f0; color: #000; }
  .b.on { background: #f2f2f0; color: #000; }
  button:disabled { opacity: .3; cursor: default; }
  /* control dial: every row rides a huge ring cut off by the right edge (placed by layoutDial) */
  #panel { position: absolute; top: 0; right: 0; height: 100%; overflow: hidden; font: 500 10.5px/1.35 "Inter Tight", "Pretendard", sans-serif; text-transform: uppercase; letter-spacing: .02em; }
  #panel > * { position: absolute; left: 0; top: 0; margin: 0 !important; }
  /* word wheel: just words fanned along a curve that bulges right; the dot marks the word in reach.
     clicking a word turns it to the dot and opens its controls under it */
  #panel .w .wl { display: block; font: 600 17px/1.15 "Inter Tight", "Pretendard", sans-serif; letter-spacing: -.01em; text-transform: uppercase; color: #f2f2f0;
    background: none; border: 0; padding: 0; margin: 0 0 0 auto; cursor: pointer; text-align: right; white-space: nowrap; }
  #panel .wd { display: none; padding: 5px 0 8px; }
  #panel .w.open .wd { display: block; }
  #panel .wd .sl { margin: 0; }
  #dialDot { position: absolute; left: 0; top: 0; pointer-events: none; }
  #selName { margin-bottom: 12px; min-height: 14px; }
  .h { color: #8a8a8a; margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid #f2f2f0; }
  .h.first { border: 0; padding: 0; margin-top: 0; }
  .sl { margin-bottom: 7px; } .sl .top { display: flex; justify-content: space-between; }
  .sl .v { color: #8a8a8a; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 12px; background: transparent; margin: 0; cursor: pointer; display: block; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: #f2f2f0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 6px; height: 10px; background: #f2f2f0; margin-top: -4.5px; border: 0; }
  input[type=range]::-moz-range-track { height: 1px; background: #f2f2f0; }
  input[type=range]::-moz-range-thumb { width: 6px; height: 10px; background: #f2f2f0; border: 0; }
  input[type=range]:disabled { opacity: .3; }
  input[type=text], input[type=password] { width: 100%; font: 500 12px "Inter Tight", "Pretendard", sans-serif; padding: 3px 0; border: 0; border-bottom: 1px solid #f2f2f0; background: transparent; color: #f2f2f0; outline: none; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
  .chip { font: inherit; text-transform: inherit; letter-spacing: inherit; background: none; border: 0; padding: 2px 0; color: #f2f2f0; display: flex; align-items: center; gap: 6px; cursor: pointer; text-align: left; }
  .chip::before { content: ''; flex: none; width: 9px; height: 9px; border: 1px solid #f2f2f0; }
  .chip.on::before { background: #f2f2f0; }
  .chip:disabled { opacity: .3; cursor: default; }
  .tick { display: flex; align-items: center; gap: 6px; margin-top: 6px; cursor: pointer; }
  input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 9px; height: 9px; border: 1px solid #f2f2f0; margin: 0; cursor: pointer; }
  input[type=checkbox]:checked { background: #f2f2f0; }
  .row2 { display: flex; gap: 6px; margin-top: 6px; } .row2 .b { flex: 1; padding: 4px 4px; }
  .wide { width: 100%; margin-top: 6px; }
  #pals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .pal { display: flex; height: 12px; overflow: hidden; border: 0; cursor: pointer; padding: 0; background: none; }
  .pal.on { outline: 1px solid #f2f2f0; outline-offset: 2px; }
  .pal i { flex: 1; } .pal i:first-child { flex: 2; }
  details summary { cursor: pointer; color: #8a8a8a; margin-top: 8px; }
  #busy { display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 6px; white-space: nowrap; font: 500 10px "Inter Tight", "Pretendard", sans-serif; font-style: normal; text-transform: uppercase; color: #8a8a8a; }
  /* keyword typed straight into the middle of the ring */
  #centre { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: none; align-items: baseline; white-space: nowrap; pointer-events: none;
    font: 400 40px "Instrument Serif", "Times New Roman", serif; color: #f2f2f0; }
  #centre input { pointer-events: auto; font: inherit; color: inherit; background: transparent; border: 0; outline: none; padding: 0; margin: 0; text-align: center; caret-color: #f2f2f0; }
  #centre input::placeholder { color: #8a8a8a; }
  #top { position: absolute; top: 12px; left: 18px; display: flex; gap: 10px; align-items: center; font: 500 12px "Inter Tight", "Pretendard", sans-serif; text-transform: uppercase; }
  #top details { position: relative; font-size: 10.5px; } #top summary { margin: 0; }
  #top .pop { position: absolute; top: 20px; left: 0; width: 230px; background: #000; border: 1px solid #f2f2f0; padding: 10px; z-index: 3; }
  body.work #top { display: none; }
  body:not(.work) #panel { display: none; }
</style>
</head>
<body>
<div id="main"><canvas id="page"></canvas>
  <div id="centre"><input id="kw" type="text" value="" placeholder="keyword" spellcheck="false" autocomplete="off"><span id="busy">choosing directions…</span></div>
  <div id="top">
    <details><summary>AI settings</summary>
      <div class="pop"><div class="h first">OpenAI key (built-in if empty)</div><input id="key" type="password" placeholder="sk-...">
      <div class="h first" style="margin-top:8px">Text model</div><input id="model" type="text" value="gpt-4o-mini">
      <div class="h first" style="margin-top:8px">Image model</div><input id="imodel" type="text" value="gpt-image-1"></div>
    </details>
  </div>
</div>
<div id="panel">
  <div class="w"><div class="wl">Weird</div><div class="wd"><div class="sl"><div class="top"><span></span><span class="v"></span></div><input type="range" data-k="weird" min="0" max="1" step="0.01"></div></div></div>
  <div class="w"><div class="wl">Style</div><div class="wd"><div class="opts" id="techs"></div></div></div>
  <div class="w"><div class="wl">Dots</div><div class="wd"><div class="opts" id="dots"></div>
    <div class="sl" style="margin-top:8px"><div class="top"><span>Size</span><span class="v"></span></div><input type="range" data-k="cell" min="4" max="24" step="1"></div></div></div>
  <div class="w"><div class="wl">Fuzz</div><div class="wd"><div class="sl"><div class="top"><span></span><span class="v"></span></div><input type="range" data-k="fuzz" min="0" max="1" step="0.01"></div></div></div>
  <div class="w"><div class="wl">Color</div><div class="wd"><div id="pals"></div><div class="row2"><button id="invert" class="b">Invert</button><button id="shuffle" class="b">Shuffle</button></div></div></div>
  <div class="w"><div class="wl">Text</div><div class="wd"><input id="text" type="text"></div></div>
  <div class="w"><div class="wl">Type</div><div class="wd"><div class="opts" id="types"></div>
    <div class="sl" style="margin-top:8px"><div class="top"><span>Size</span><span class="v"></span></div><input type="range" data-k="typeSize" min="0.3" max="2" step="0.01"></div></div></div>
  <div class="w"><button id="del" class="wl">Delete</button></div>
  <div class="w"><div class="wl">Save</div><div class="wd"><div class="row2"><button id="pngPage" class="b">Page PNG</button><button id="pngSel" class="b">Graphic PNG</button></div></div></div>
</div>

<script>
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- vocabulary
const VW = 800, VH = 1000;   // virtual poster size, every canvas is drawn at this ratio
const PALETTES = {
  paper:  { bg: '#f3efe6', ink: '#111111', colors: ['#e8402a', '#2a5bd7', '#f2c230'] },
  mono:   { bg: '#ffffff', ink: '#111111', colors: ['#111111', '#5a5a5a', '#bdbdbd'] },
  night:  { bg: '#0d0f2b', ink: '#f5f0e6', colors: ['#ff5fa2', '#7b6cff', '#ffd23f'] },
  pastel: { bg: '#fff6f0', ink: '#2b2b2b', colors: ['#ffb3c7', '#b6e3ff', '#c9f2c7', '#ffe29a'] },
  acid:   { bg: '#e8ff3a', ink: '#111111', colors: ['#ff2bd6', '#111111', '#00c2ff'] },
  forest: { bg: '#e9e4d0', ink: '#1f3a26', colors: ['#2f6b3a', '#9cc96b', '#c9772b'] },
  sea:    { bg: '#e6f2ff', ink: '#0b2a4a', colors: ['#1e6bd6', '#3fc1c9', '#0b2a4a', '#ffffff'] },
  red:    { bg: '#d9261c', ink: '#fff3e6', colors: ['#fff3e6', '#111111', '#ffb000'] },
};
const FORMS = { circle: 'Circle', square: 'Square', triangle: 'Triangle', line: 'Line', letter: 'Letter' };
const LAYOUTS = { grid: 'Grid', radial: 'Radial', scatter: 'Scatter', stack: 'Stack', spiral: 'Spiral', wave: 'Wave' };
const TYPES = { big: 'Big', center: 'Center', repeat: 'Pattern', scatter: 'Scattered', none: 'None' };
const NUM = { weird: [0, 1], scale: [.2, 3], sizeVar: [0, 1], distort: [0, 1], rotate: [0, 1], count: [0, 200, 1], typeSize: [.3, 2], cell: [4, 24, 1], fuzz: [0, 1] };
const DOTS = { square: 'Square', circle: 'Round' };
const LABEL = { weird: 'Weird', scale: 'Scale', sizeVar: 'Size Mix', distort: 'Distort', rotate: 'Rotate', count: 'Count', typeSize: 'Type Size', cell: 'Dot Size', fuzz: 'Fuzz' };
const EN = { circle: 'Circle', square: 'Square', triangle: 'Triangle', line: 'Line', letter: 'Letter',
  grid: 'Grid', radial: 'Radial', scatter: 'Scatter', stack: 'Stack', spiral: 'Spiral', wave: 'Wave',
  big: 'Big Type', center: 'Center Type', repeat: 'Type Pattern', none: 'No Type' };
const KIND = { ai: '', edit: 'Edit', combo: 'Mix', mutant: 'Mutant' };
const tagOf = it => `(${it.num}) ${it.kind === 'ai' ? (it.gene.mood === 'weird' ? 'Weird' : 'Normal') : KIND[it.kind]} ${it.kind === 'ai' ? it.gene.title : it.title}`;
const BASE = { text: 'KEYWORD', bg: '#f3efe6', ink: '#111111', colors: PALETTES.paper.colors, form: 'circle', layout: 'grid',
  count: 24, scale: 1, sizeVar: .1, distort: 0, rotate: 0, typeMode: 'big', typeSize: 1, blend: false, weird: 0, cell: 5, fuzz: .45, dot: 'square', tech: 'dots' };

function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const newSeed = () => (Math.random() * 1e9) | 0;
const clone = g => JSON.parse(JSON.stringify(g));
const isHex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v.trim());
const hex2rgb = h => { const n = parseInt((isHex(h) ? h : '#888888').slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };

// ---------------------------------------------------------------- renderer
function eff(g) { // the weird dial pushes every other variable toward chaos
  const w = g.weird;
  return { ...g, sizeVar: clamp(g.sizeVar + w * .9, 0, 1.6), rotate: clamp(g.rotate + w, 0, 1.5), distort: clamp(g.distort + w * .8, 0, 1.4) };
}

function layoutPoints(g, R) {
  const N = Math.max(1, Math.round(g.count)), m = 70, w = VW - 2 * m, h = VH - 2 * m - (g.typeMode === 'big' ? 160 : 0);
  const cx = VW / 2, cy = m + h / 2, pts = [];
  const base = Math.sqrt(w * h / N) * .62;
  switch (g.layout) {
    case 'grid': {
      const cols = Math.max(1, Math.round(Math.sqrt(N * w / h))), rows = Math.ceil(N / cols), cw = w / cols, ch = h / rows;
      for (let i = 0; i < N; i++) pts.push([m + (i % cols + .5) * cw, m + (Math.floor(i / cols) + .5) * ch, Math.min(cw, ch) * .8]);
      break;
    }
    case 'radial': {
      if (N === 1) { pts.push([cx, cy, Math.min(w, h) * .6]); break; }
      let i = 0, ring = 0;
      while (i < N) {
        const r = ring * Math.min(w, h) * .11, k = ring === 0 ? 1 : Math.round(ring * 6.3);
        for (let j = 0; j < k && i < N; j++, i++) { const a = j / k * Math.PI * 2 + ring * .4; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r, Math.min(w, h) * .09]); }
        ring++;
      }
      break;
    }
    case 'stack':
      for (let i = 0; i < N; i++) { const t = N === 1 ? .5 : i / (N - 1); pts.push([cx + (R() - .5) * w * .15, m + h * (.1 + .8 * t), Math.min(w * .7, h / N * 2.2)]); }
      break;
    case 'spiral':
      for (let i = 0; i < N; i++) { const r = Math.sqrt((i + .5) / N) * Math.min(w, h) * .5, a = i * 2.39996; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r, Math.min(w, h) / Math.sqrt(N) * .75]); }
      break;
    case 'wave': {
      const rows = Math.max(1, Math.round(Math.sqrt(N * h / w) * .7)), per = Math.ceil(N / rows);
      for (let i = 0; i < N; i++) {
        const r = Math.floor(i / per), j = i % per, x = m + (j + .5) / per * w;
        pts.push([x, m + (r + .5) / rows * h + Math.sin(x / w * Math.PI * 3 + r) * h / rows * .45, Math.min(w / per, h / rows) * .95]);
      }
      break;
    }
    default: // scatter
      for (let i = 0; i < N; i++) pts.push([m + R() * w, m + R() * h, base]);
  }
  return pts;
}

// unit radius of a form at angle a (polar outline)
function formR(form, a) {
  switch (form) {
    case 'square': return .82 / Math.max(Math.abs(Math.cos(a)), Math.abs(Math.sin(a)));
    case 'triangle': { const s = Math.PI * 2 / 3, t = ((a + Math.PI / 2) % s + s) % s - s / 2; return .55 / Math.cos(t); }
    default: return 1;
  }
}

function drawForm(c, g, it, R) {
  const { x, y, s, rot, col } = it;
  const form = g.form2 && it.i % 2 ? g.form2 : g.form;
  c.save(); c.translate(x, y); c.rotate(rot); c.fillStyle = col;
  if (form === 'letter') {
    const chars = [...g.text.replace(/\s/g, '')] ; const ch = chars.length ? chars[it.i % chars.length] : '?';
    c.font = `900 ${s * 1.1}px "Helvetica Neue", Arial, "Pretendard", sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.scale(1 + g.distort * (it.n[0] - .5), 1 + g.distort * (it.n[1] - .5));
    c.fillText(ch, 0, 0);
  } else if (form === 'line') {
    const len = s * 1.3, wv = g.distort;
    c.strokeStyle = col; c.lineWidth = Math.max(2, s * .12); c.lineCap = 'round'; c.beginPath();
    for (let i = 0; i <= 30; i++) { const t = i / 30 - .5; c.lineTo(t * len, Math.sin(t * 9 + it.n[0] * 6) * wv * s * .35); }
    c.stroke();
  } else {
    const r = s / 2, dist = g.distort, N = 90;
    c.beginPath();
    for (let i = 0; i <= N; i++) {
      const a = i / N * Math.PI * 2;
      const noise = .5 * Math.sin(2 * a + it.n[0] * 6.28) + .3 * Math.sin(3 * a + it.n[1] * 6.28) + .2 * Math.sin(5 * a + it.n[2] * 6.28);
      const rr = r * formR(form, a) * (1 + dist * .45 * noise);
      c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    c.closePath(); c.fill();
  }
  c.restore();
}

function fitFont(c, text, width, weight = 900) {
  c.font = `${weight} 100px "Helvetica Neue", Arial, "Pretendard", sans-serif`;
  return 100 * width / Math.max(1, c.measureText(text).width);
}

// ---------------------------------------------------------------- keyword pictures: what the keyword actually looks like
// every motif has three plain compositions (the NORMAL ideas); WEIRD ideas twist a picture with mods
const MOTIFS = {
  mushroom: { re: /버섯|mushroom|fung|균사|곰팡|shroom|toadstool|morel|송이|표고/i, pal: { bg: '#e9e2d4', ink: '#2a1f14', colors: ['#c8321e', '#e8a33a', '#5f7a35', '#6b4528'] }, titles: ['One Mushroom', 'Forest Floor', 'Specimens'] },
  sea:      { re: /바다|sea|ocean|파도|wave|water|beach|해변|수영|swim/i, pal: { bg: '#e6eef2', ink: '#0b2a4a', colors: ['#1d5f9e', '#3fc1c9', '#0b2a4a', '#f2b866'] }, titles: ['Horizon', 'Big Wave', 'Aerial Shore'] },
  forest:   { re: /숲|forest|나무|tree|wood|자연|nature|정글|jungle|캠핑|camp/i, pal: { bg: '#eef2e4', ink: '#1f3a26', colors: ['#2f6b3a', '#9cc96b', '#8a5a2b', '#1f3a26'] }, titles: ['Treeline', 'One Tree', 'Canopy'] },
  city:     { re: /도시|city|building|빌딩|건물|서울|seoul|town|street|거리|뉴욕|new york/i, pal: { bg: '#f1f1ee', ink: '#151515', colors: ['#151515', '#e8402a', '#2a5bd7', '#f2c230'] }, titles: ['Skyline', 'Tower', 'Blocks'] },
  space:    { re: /우주|space|밤|night|별|star|달|moon|galaxy|은하|planet|행성|dream|꿈/i, pal: { bg: '#0d0f2b', ink: '#f5f0e6', colors: ['#ffd23f', '#7b6cff', '#ff5fa2', '#f5f0e6'] }, titles: ['Moonlight', 'Ringed Planet', 'Galaxy'] },
  mountain: { re: /산|mountain|hill|언덕|등산|peak|알프스|alps|snow|눈/i, pal: { bg: '#f4f0e8', ink: '#20263a', colors: ['#3d5a80', '#98c1d9', '#20263a', '#ee6c4d'] }, titles: ['Ranges', 'Summit', 'Contours'] },
  love:     { re: /사랑|love|하트|heart|연애|romance|kiss|친구|friend|우정/i, pal: { bg: '#fff0f3', ink: '#b0123a', colors: ['#e8262f', '#ff4c96', '#ffb3c7', '#b0123a'] }, titles: ['Big Heart', 'Heart Rain', 'Two of Us'] },
  flower:   { re: /꽃|flower|봄|spring|garden|정원|blossom|벚꽃|plant|식물/i, pal: { bg: '#efe9df', ink: '#2b1d1f', colors: ['#d8506e', '#f0c348', '#4d7a3a', '#9c2440'] }, titles: ['One Bloom', 'Meadow', 'Close Up'] },
  sun:      { re: /해|sun|summer|여름|태양|sunset|노을|hot|더위|휴가|vacation/i, pal: { bg: '#fff4dc', ink: '#5a1a00', colors: ['#ff8a1c', '#e8262f', '#ffcf2e', '#5a1a00'] }, titles: ['Sun Rays', 'Parasol', 'Sunset Bands'] },
  rain:     { re: /비|rain|cloud|구름|날씨|weather|storm|폭풍|우산|umbrella/i, pal: { bg: '#eef1f4', ink: '#1d2b3a', colors: ['#3f6fa3', '#9fb4c7', '#1d2b3a', '#f2c230'] }, titles: ['Rain Cloud', 'Umbrella', 'Puddle'] },
  cat:      { re: /고양이|cat|kitty|냥|animal|동물|pet|강아지|dog|puppy/i, pal: { bg: '#f7f1e6', ink: '#1b1b1b', colors: ['#1b1b1b', '#e8902a', '#7fc04a', '#e8402a'] }, titles: ['Cat Face', 'Sitting Cat', 'Paw Prints'] },
  word:     { re: /$^/, pal: { bg: '#f3efe6', ink: '#111111', colors: ['#e8402a', '#2a5bd7', '#f2c230', '#111111'] }, titles: ['Big Word', 'Echo', 'Letter Boxes'] },
};
const motifOf = kw => Object.keys(MOTIFS).find(k => MOTIFS[k].re.test(kw)) || 'word';
const IMGS = new Map();   // AI-painted pictures by id

function heartShape(c, x, y, s) {
  c.beginPath();
  for (let i = 0; i <= 50; i++) { const b = i / 50 * Math.PI * 2; c.lineTo(x + 16 * Math.sin(b) ** 3 / 16 * s, y - (13 * Math.cos(b) - 5 * Math.cos(2 * b) - 2 * Math.cos(3 * b) - Math.cos(4 * b)) / 16 * s); }
  c.closePath(); c.fill();
}
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
function tri(c, x1, y1, x2, y2, x3, y3) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineTo(x3, y3); c.closePath(); c.fill(); }
function waveLine(c, y, amp, freq, ph) { c.beginPath(); for (let x = -10; x <= VW + 10; x += 8) c.lineTo(x, y + Math.sin(x * freq + ph) * amp); c.stroke(); }

async function askOpenAI(kw) {
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + $('key').value.trim() },
    body: JSON.stringify({ model: $('model').value.trim() || 'gpt-4o-mini', temperature: 1, response_format: { type: 'json_object' },
      messages: [{ role: 'system', content: SYS }, { role: 'user', content: 'Keyword: ' + kw }] }),

    const k = (now - l.t0) / 420, w = t * (l.it.ds || 1);
    c.save(); c.globalAlpha = 1 - k; c.translate(l.it.dx, l.it.dy + k * k * 70); c.rotate((l.it.da || 0) + k * .6); c.drawImage(l.it.thumb, -w / 2, -w * .625, w, w * 1.25); c.restore();
  });
  if (page.leaving.length && !animating) { animating = true; requestAnimationFrame(() => { animating = false; drawPage(); }); }

}
function centreNote(c, x, y, hole = 1e9) {   // keyword input dead centre of the ring, sized to the hole and to what is typed
  const inp = $('kw'), word = inp.value || inp.placeholder;
  c.font = `400 100px ${SERIF}`; const fs = clamp(Math.min(page.H * KW_SIZE, 100 * hole * 1.5 / c.measureText(word).width), 14, KW_MAX);
  c.font = `400 ${fs}px ${SERIF}`;
  const box = $('centre'); box.style.display = 'flex'; box.style.fontSize = fs + 'px'; box.style.left = x + 'px'; box.style.top = y + 'px';
  inp.style.width = Math.ceil(c.measureText(word).width + fs * .15) + 'px';
}
// work screen: the picked idea big in the middle, its AI origin small beside it
const ORIGIN_SIZE = .18, ORIGIN_GAP = 18, ORIGIN_CLEAR = 120;   // AI original beside the poster: width (× poster width), gap to the poster, room kept for the dial's words
// x of the point halfway between the left ring's dot (drawMini) and the dial's dot (layoutDial)
const dotsMid = () => ((MINI_SHOW - clamp(page.H * .075, 36, 70) * .625 - DIAL_DOT_GAP + 10) + (page.W - DIAL_IN + DIAL_DOT_GAP)) / 2;
function drawWork(c, sel) {
  const W = page.W, H = page.H;
  if (!sel) return;
  const room = W - MINI_SHOW - DIAL_SHOW;   // the space between the two cut-off rings
  // the poster is centred halfway between the two blue dots; its AI original sits small just right of the poster, level with its top edge
  const pw = Math.min(room * .5, (H - 200) / 1.25), ph = pw * 1.25, py = Math.max(56, (H - ph - 90) / 2);
  const px = clamp(dotsMid() - pw / 2, MINI_SHOW + 150, W - DIAL_SHOW + 40 - pw);
  drawBig(c, sel, px, py, pw);
  const root = rootAI(sel), sw = Math.min(pw * ORIGIN_SIZE, (W - DIAL_IN - ORIGIN_CLEAR) - (px + pw) - ORIGIN_GAP);   // never into the dial's words
  page.origin = null;
  if (root && root !== sel && sw > 36) {
    const ox = px + pw + ORIGIN_GAP;
    page.origin = { it: root, rect: [ox, py, sw, 36 + sw * 1.25] };   // the label, poster and name: clicking any of it opens the AI origin
    c.font = `500 10px ${PF}`; c.fillStyle = DIM; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText('AI ORIGIN', ox, py);
    poster(c, root.gene, root.seed, ox, py + 16, sw);
    c.fillStyle = FG; c.fillText(`${root.num} ${kindWord(root)}`, ox, py + 24 + sw * 1.25);
  }
  page.bigRect = [px, py, pw, ph + 60];
  drawDialRing(c);
  drawMini(c, sel);
  c.textAlign = 'left';
}
// the controls' ring on the right: its line, and a notch where the row in reach sits
const dialGeo = () => { const r = page.H * DIAL_R; return { x: page.W - DIAL_SHOW + r, y: page.H / 2, r }; };
function drawDialRing(c) {   // the dial draws itself (rows + dot) in the panel

}
// the bracelet again on the left, so big that only its right edge shows: the open idea sits at the middle, its neighbours above and below
const wrapN = (d, N) => ((d % N) + N * 1.5) % N - N / 2;
function drawMini(c, sel) {
  const N = page.order.length; page.mini = [];
  if (!N) return;
  const r = page.H * MINI_R, mx = MINI_SHOW - r, my = page.H / 2, bw = clamp(page.H * .075, 36, 70), step = bw * 1.45 / r;
  page.miniC = [mx, my, r, bw];
  const si = Math.max(0, page.order.indexOf(sel.id));
  if (page.miniTarget == null) page.miniTarget = si;
  if (page.miniPos == null) page.miniPos = page.miniTarget;
  const dp = wrapN(page.miniTarget - page.miniPos, N);   // turns toward its target (the open idea, or where the wheel left it) the shorter way round
  if (Math.abs(dp) > .002) { page.miniPos += dp * .18; if (!animating) { animating = true; requestAnimationFrame(() => { animating = false; drawPage(); }); } } else page.miniPos = page.miniTarget;
  page.order.forEach((id, i) => {
    const it = byId(id), a = wrapN(i - page.miniPos, N) * step; if (Math.abs(a) > 1.4) return;
    const x = mx + Math.cos(a) * r, y = my + Math.sin(a) * r; if (y < -bw || y > page.H + bw) return;
    const o = clamp(1 - (Math.abs(a) - .3) / .7, .25, 1);   // fades away from the dot, like the control dial's words
    c.save(); c.translate(x, y); c.rotate(a + Math.PI / 2); c.globalAlpha = (it === sel || it === page.hover ? 1 : .6) * o;
    c.drawImage(it.thumb, -bw / 2, -bw * .625, bw, bw * 1.25);
    c.restore();
    // its label fans out from the bead along the spoke, set like the dial's words
    const lr = r + bw * .625 + 12;
    c.save(); c.translate(mx + Math.cos(a) * lr, my + Math.sin(a) * lr); c.rotate(a); c.globalAlpha = (it === sel ? 1 : .6) * o;
    c.font = WORD_FONT; c.letterSpacing = WORD_TRACK; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = FG;
    c.fillText(`${it.num} ${kindWord(it)}`, 0, 0); c.letterSpacing = '0px'; c.restore();
    page.mini.push({ it, x, y, s: bw * .7 });

  c.globalAlpha = 1;
  c.fillStyle = DIAL_DOT; circle(c, MINI_SHOW - bw * .625 - DIAL_DOT_GAP + 10, my, DIAL_DOT_R);   // the dot beside the open idea, mirroring the dial's
  c.fillStyle = page.hover === 'centre' ? FG : DIM; c.font = WORD_FONT; c.letterSpacing = WORD_TRACK; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText('← RING', 20, my); c.letterSpacing = '0px';
}
// the mouse wheel turns the left ring too; when it stops, it settles on the nearest bead and opens it, no click needed
let miniSnap = 0;
function turnMini(d) {
  page.miniTarget = (page.miniTarget ?? page.miniPos ?? 0) + d / (clamp(page.H * .075, 36, 70) * 1.45);
  clearTimeout(miniSnap); miniSnap = setTimeout(() => {
    page.miniTarget = Math.round(page.miniTarget);
    const N = page.order.length, it = N && byId(page.order[((page.miniTarget % N) + N) % N]);
    if (it && it.id !== page.sel) { const keep = page.miniTarget; select(it); page.miniTarget = keep; }   // keep the unwrapped target so the ring doesn't spin back round
    drawPage();

}
function hitWork(x, y) {   // what's under the pointer on the work screen
  const m = (page.mini || []).find(b => Math.hypot(x - b.x, y - b.y) < b.s); if (m) return m.it;
  if (page.origin) { const [ox, oy, ow, oh] = page.origin.rect; if (x > ox && x < ox + ow && y > oy && y < oy + oh) return page.origin.it; }
  if (page.miniC && Math.hypot(x - page.miniC[0], y - page.miniC[1]) < page.miniC[2] - page.miniC[3] * .8) return 'centre';
  const [bx, by, bw, bh] = page.bigRect || [0, 0, 0, 0];
  if (x > bx - 20 && x < bx + bw + 20 && y > by - 20 && y < by + bh) return 'big';
  return 'outside';
}
function emptyNote(c) {
  if (page.items.length) return;
  c.fillStyle = DIM; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `500 11px ${PF}`;
  c.fillText('TYPE A KEYWORD · PRESS ENTER', page.W / 2, page.H / 2 + Math.min(page.H * .08, 64) + 20); c.textAlign = 'left';
}

// ---------------------------------------------------------------- pointer: click = select, drag onto idea = combine, wheel = turn the ring
const pp = e => { const r = pcv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
pcv.addEventListener('pointerdown', e => {
  if (mode === 'work') {   // mini bead or the AI origin → that idea · mini centre or empty space → back to the ring
    const h = hitWork(...pp(e));
    if (h && typeof h === 'object') openWork(h); else if (h === 'centre' || h === 'outside') setMode('ring');
    return;
  }
  const [x, y] = pp(e), it = hitItem(x, y); if (!it) return;
  pcv.setPointerCapture(e.pointerId); page.drag = { item: it, x, y, x0: x, y0: y, moved: false };
});
pcv.addEventListener('pointermove', e => {
  const d = page.drag, [x, y] = pp(e);
  if (mode === 'work') {
    const h = hitWork(x, y), hv = h === 'big' || h === 'outside' ? null : h, hb = h === 'big';
    pcv.style.cursor = h === 'big' ? 'default' : 'pointer';
    if (hv !== page.hover) { page.hover = hv; drawPage(); }
    return;
  }
  if (!d) { const h = hitItem(x, y); pcv.style.cursor = h ? 'grab' : 'default'; if (h !== page.hover) { page.hover = h; drawPage(); } return; }
  d.x = x; d.y = y; if (!d.moved && Math.hypot(x - d.x0, y - d.y0) > 6) { d.moved = true; startString(d.item, x, y); }
  const h = hitItem(x, y); page.hover = h && h !== d.item ? h : null;
  if (d.moved) {   // over another idea: the string hooks onto its middle and is plucked once
    if (page.hover && page.hover !== str.b) { const [hx, hy] = pos(page.hover), dx = hx - str.ax, dy = hy - str.ay, l = Math.hypot(dx, dy) || 1, s = Math.random() < .5 ? -1 : 1; str.vx += -dy / l * STR_HOOK_KICK * s; str.vy += dx / l * STR_HOOK_KICK * s; }
    str.b = page.hover; if (!str.b) { str.bx = x; str.by = y; }
  }
  drawPage();
});
pcv.addEventListener('pointerup', () => {
  const d = page.drag; page.drag = null; page.hover = null; if (!d) return;
  if (!d.moved) return openWork(d.item);
  const target = hitItem(d.x, d.y);
  if (target && target !== d.item) { releaseString(target); combine(d.item, target); }   // the string stays hooked between the two middles as the ring makes room
  else if (offString(d.x, d.y)) { str.on = false; d.item.dx = d.x; d.item.dy = d.y; removeItem(d.item); }   // dragged off the string → it comes off
  else { releaseString(); drawPage(); }   // let go on the ring → the string springs back into the bead

pcv.addEventListener('pointerleave', () => { if (!page.drag && page.hover) { page.hover = null; drawPage(); } });
pcv.addEventListener('wheel', e => {
  if (mode === 'work') { if (pp(e)[0] < MINI_SHOW + 180) { e.preventDefault(); turnMini(e.deltaY + e.deltaX); } return; }
  e.preventDefault(); page.rot += (e.deltaY + e.deltaX) * .0015; drawPage();
}, { passive: false });
window.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'Escape' && mode === 'work') setMode('ring');
  if (e.key === 'Delete' || e.key === 'Backspace') removeSel();
});
window.addEventListener('resize', () => { sizePage(); drawPage(); kickDial(); });

// ---------------------------------------------------------------- AI proposals become the first six ideas on the ring
let proposing = false;
async function propose() {
  if (proposing) return; proposing = true;
  const kw = $('kw').value.trim() || 'Graphic';
  $('busy').style.display = 'block';
  try {
    let gens;
    if ($('key').value.trim()) {
      try { gens = await askOpenAI(kw); } catch (e) { console.warn(e); alert('AI call failed — using the built-in generator instead\n' + e.message); }
    }
    const fromAI = !!gens;
    gens = gens || localDirections(kw);
    spreadTechs(gens, !fromAI);
    if (fromAI) gens.forEach((g, i) => { g.motif = g.motif || motifOf(kw); g.variant = i % 3; });   // stand-in picture until the painting arrives
    page.items = []; page.order = []; page.n = 0; page.rot = 0;
    const made = gens.map(g => addItem({ kind: 'ai', gene: g, seed: newSeed(), title: g.title }));
    select(null);
    if (fromAI) paintAll(made);
  } finally { proposing = false; $('busy').style.display = 'none'; }
}
// with a key, every AI idea also gets a real painting of its prompt; it drops in when ready (and gets dot-screened like the rest)
let imgN = 0;
async function genImage(prompt) {
  const res = await fetch('https://api.openai.com/v1/images/generations', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + $('key').value.trim() },
    body: JSON.stringify({ model: $('imodel').value.trim() || 'gpt-image-1', size: '1024x1536', quality: 'low', n: 1,
      prompt: prompt + ' Flat graphic poster illustration, bold simple shapes, strong contrast, plain light background, no text, no letters.' }),
  });
  if (!res.ok) throw new Error('image ' + res.status + ' ' + (await res.text()).slice(0, 200));
  const img = new Image(); img.src = 'data:image/png;base64,' + (await res.json()).data[0].b64_json; await img.decode();
  const id = 'img' + (++imgN); IMGS.set(id, img); return id;
}
async function paintAll(items) {
  let done = 0; const busy = $('busy'); busy.style.display = 'inline'; busy.textContent = `painting 0/${items.length}…`;
  await Promise.all(items.map(it => it.gene.prompt ? genImage(it.gene.prompt).then(id => {
    it.gene.img = id; makeThumb(it); bigCache.clear();
    if (page.sel === it.id && draft) draft.img = id;
    drawPage();
  }).catch(e => console.warn(e)).finally(() => { busy.textContent = `painting ${++done}/${items.length}…`; }) : null));
  busy.style.display = 'none'; busy.textContent = 'choosing directions…';
}

// ---------------------------------------------------------------- panel
const ranges = [...document.querySelectorAll('input[data-k]')];
function chipRow(id, dict, key) {
  Object.entries(dict).forEach(([k, v]) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = v; b.dataset[key] = k; $(id).appendChild(b); });
}
chipRow('techs', TECHS, 'tech'); chipRow('dots', DOTS, 'dot'); chipRow('types', TYPES, 'type');
Object.entries(PALETTES).forEach(([k, p]) => { const b = document.createElement('button'); b.className = 'pal'; b.title = k; b.dataset.pal = k; b.innerHTML = [p.bg, ...p.colors].map(c => `<i style="background:${c}"></i>`).join(''); $('pals').appendChild(b); });

// control dial: a wheel of words. They fan out from a centre off to the left, so the curve bulges right;
// the word in reach sits by the dot, the rest swing away above and below and get cut off.
// the mouse wheel turns it. Clicking a word turns it to the dot and opens its controls under it;
// an action word (delete) runs only when it is already at the dot.
const dial = { items: [...$('panel').children], pos: 0, target: null, raf: 0, eat: false, focus: null };
$('panel').style.width = DIAL_SHOW + 'px';
const DIAL_ROW = DIAL_SHOW - DIAL_IN - 24;   // room for a word and its open controls
dial.items.forEach(el => el.style.width = DIAL_ROW + 'px');
const dotEl = document.createElement('div'); dotEl.id = 'dialDot';
dotEl.style.cssText += `width:${DIAL_DOT_R * 2}px;height:${DIAL_DOT_R * 2}px;background:${DIAL_DOT};`;
dotEl.style.setProperty('border-radius', '50%', 'important');
$('panel').prepend(dotEl);
const openWord = el => dial.items.forEach(x => x.classList.toggle('open', x === el));
// capitals sit a little above the middle of their line box: how far the middle of the caps is from it
function capShift(lh) {
  const c = pc; c.save(); c.font = WORD_FONT; c.textBaseline = 'alphabetic';
  const m = c.measureText('H'), fa = m.fontBoundingBoxAscent, fd = m.fontBoundingBoxDescent; c.restore();
  return (lh - fa - fd) / 2 + fa - m.actualBoundingBoxAscent / 2 - lh / 2;
}
function layoutDial() {
  dial.raf = 0;
  if (mode !== 'work') return;
  const r = dialGeo().r; let s = 0;
  // each word pivots on its own line; open controls hang below it and push the later words along
  const rows = dial.items.map(el => { const lh = el.firstElementChild.offsetHeight; s += DIAL_GAP; const m = s + lh / 2; s += el.offsetHeight; return { el, lh, m }; });
  const lo = rows[0].m, hi = rows[rows.length - 1].m;
  if (dial.target == null) dial.target = dial.pos = lo;   // first word starts at the dot

  dial.target = clamp(dial.target, lo, hi);
  dial.pos += (dial.target - dial.pos) * .2; if (Math.abs(dial.target - dial.pos) < .3) dial.pos = dial.target;
  const near = rows.reduce((b, o) => Math.abs(o.m - dial.pos) < Math.abs(b.m - dial.pos) ? o : b);
  // mirror of the left ring: the wheel's centre is off to the right, so the curve bulges toward the middle of the screen;
  // each word ends on the curve and points away from that centre

    const a = (m - dial.pos) / r, o = clamp(1 - (Math.abs(a) - .3) / .7, .25, 1);
    el.style.transformOrigin = `${DIAL_ROW}px ${lh / 2}px`;
    el.style.transform = `translate(${ex + r * (1 - Math.cos(a)) - DIAL_ROW}px, ${page.H / 2 + r * Math.sin(a) - lh / 2}px) rotate(${-a}rad)`;
    el.style.opacity = o; el.dataset.at = el === near.el ? '1' : ''; el.dataset.m = m;
    if (el !== near.el && el !== dial.focus && el.classList.contains('open')) el.classList.remove('open');   // turned away → folds up
  });
  dotEl.style.transform = `translate(${ex + DIAL_DOT_GAP - DIAL_DOT_R}px, ${page.H / 2 + capShift(near.lh) - DIAL_DOT_R}px)`;

}
function kickDial() { if (!dial.raf) dial.raf = requestAnimationFrame(layoutDial); }
// when the wheel stops, the dial settles with the nearest word exactly at the dot (like the left ring)
let dialSnap = 0;
$('panel').addEventListener('wheel', e => {
  e.preventDefault(); dial.focus = null; dial.target = (dial.target ?? dial.pos) + e.deltaY + e.deltaX; kickDial();
  clearTimeout(dialSnap); dialSnap = setTimeout(() => { dial.target = dial.items.map(el => +el.dataset.m).reduce((b, m) => Math.abs(m - dial.target) < Math.abs(b - dial.target) ? m : b); kickDial(); }, 140);
}, { passive: false });
$('panel').addEventListener('pointerdown', e => {
  const el = dial.items.find(x => x.contains(e.target)); dial.eat = false; if (!el) return;
  const hasCtl = !!el.querySelector('.wd');
  if (!el.dataset.at) { dial.eat = true; dial.focus = el; if (hasCtl) openWord(el); }   // not in reach: turn it to the dot (and open it)
  else if (hasCtl && e.target.closest('.wl')) { dial.eat = true; const open = !el.classList.contains('open'); openWord(open ? el : null); dial.focus = open ? el : null; }
  if (dial.eat) { e.preventDefault(); e.stopPropagation(); kickDial(); }
}, true);
$('panel').addEventListener('click', e => { if (dial.eat) { e.preventDefault(); e.stopPropagation(); dial.eat = false; } }, true);

function syncPanel() {
  kickDial();
  const on = !!draft;
  document.querySelectorAll('#panel input[data-k], #panel .chip, #panel .pal, #text, #del, #pngSel, #shuffle, #invert').forEach(el => el.disabled = !on);
  if (!on) return;
  ranges.forEach(r => { const k = r.dataset.k; r.value = draft[k]; r.parentElement.querySelector('.v').textContent = (+draft[k]).toFixed(NUM[k][2] ? 0 : 2); });
  document.querySelectorAll('[data-tech]').forEach(b => b.classList.toggle('on', b.dataset.tech === (draft.tech || 'dots')));
  document.querySelectorAll('[data-dot]').forEach(b => b.classList.toggle('on', b.dataset.dot === draft.dot));
  document.querySelectorAll('[data-type]').forEach(b => b.classList.toggle('on', b.dataset.type === draft.typeMode));
  document.querySelectorAll('[data-pal]').forEach(b => b.classList.toggle('on', PALETTES[b.dataset.pal].bg === draft.bg && PALETTES[b.dataset.pal].colors.join() === draft.colors.join()));
  if (document.activeElement !== $('text')) $('text').value = draft.text;
}

ranges.forEach(r => {
  r.addEventListener('input', () => { draft[r.dataset.k] = +r.value; syncPanel(); drawPage(); });
  r.addEventListener('change', () => { const k = r.dataset.k, d = draft[k] - selItem().gene[k]; if (d) commitEdit(`${LABEL[k]} ${d > 0 ? '↑' : '↓'}`); });
});
$('text').addEventListener('input', () => { draft.text = $('text').value; drawPage(); });
$('text').addEventListener('change', () => { if (draft.text.trim() && draft.text !== selItem().gene.text) commitEdit('Text'); });
$('techs').onclick = e => { const k = e.target.dataset.tech; if (k && k !== (draft.tech || 'dots')) { draft.tech = k; commitEdit(TECHS[k]); } };
$('dots').onclick = e => { const k = e.target.dataset.dot; if (k && k !== draft.dot) { draft.dot = k; commitEdit(DOTS[k] + ' Dots'); } };
$('types').onclick = e => { const k = e.target.dataset.type; if (k && k !== draft.typeMode) { draft.typeMode = k; commitEdit(k === 'scatter' ? 'Scattered Type' : EN[k]); } };
$('pals').onclick = e => { const b = e.target.closest('[data-pal]'); if (b) { Object.assign(draft, clone(PALETTES[b.dataset.pal])); commitEdit(b.dataset.pal[0].toUpperCase() + b.dataset.pal.slice(1) + ' Color'); } };
$('invert').onclick = () => { [draft.bg, draft.ink] = [draft.ink, draft.bg]; commitEdit('Invert'); };
$('shuffle').onclick = () => { draft.colors = draft.colors.slice().sort(() => Math.random() - .5); commitEdit('Shuffle Color', newSeed()); };
$('del').onclick = removeSel;
$('kw').addEventListener('keydown', e => { if (e.key === 'Enter') { if ($('kw').value.trim()) { propose(); $('kw').blur(); } } else if (e.key === 'Escape') $('kw').blur(); });
$('kw').addEventListener('input', drawPage);
try { $('key').value = localStorage.getItem('graphic-key') || ''; } catch (e) {}
$('key').addEventListener('change', () => { try { localStorage.setItem('graphic-key', $('key').value.trim()); } catch (e) {} });

function download(canvas, name) { const a = document.createElement('a'); a.download = name; a.href = canvas.toDataURL('image/png'); a.click(); }
$('pngPage').onclick = () => download(pcv, 'graphic-page.png');
$('pngSel').onclick = () => { const o = document.createElement('canvas'); o.width = 960; o.height = 1200; paint(o, { gene: draft, seed: selItem().seed }); download(o, 'graphic-' + selItem().num + '.png'); };

sizePage(); syncPanel(); drawPage();

// canvas text needs the web fonts first; then repaint thumbnails so their type uses them too
Promise.all(['400', '900'].map(wt => document.fonts.load(`${wt} 20px Pretendard`, '가'))
  .concat(['500 20px "Inter Tight"', '600 20px "Inter Tight"', 'italic 400 20px "Inter Tight"', '500 20px "IBM Plex Mono"'].map(f => document.fonts.load(f))))
  .catch(() => {}).then(() => document.fonts.ready).then(() => { page.items.forEach(makeThumb); bigCache.clear(); drawPage(); });
$('kw').focus();   // starts empty: type a keyword and press Enter
</script>
